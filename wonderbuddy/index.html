<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WonderBuddy – Fun Chatbot for Kids</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#fff4d6,#e6f7ff);min-height:100vh;color:#263238}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column}header{padding:22px 24px;background:#ffffffd9;display:flex;align-items:center;gap:14px;border-bottom:1px solid #fff}.logo{width:58px;height:58px;border-radius:18px;background:#ffd166;display:grid;place-items:center;font-size:32px;box-shadow:0 5px 15px #0001}h1{margin:0;font-size:26px;color:#354052}.sub{margin:3px 0 0;color:#697586;font-size:14px}.chat{flex:1;padding:25px 20px 130px;overflow:auto}.msg{display:flex;margin:13px 0;gap:10px;align-items:flex-end}.bot{justify-content:flex-start}.user{justify-content:flex-end}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#bde0fe;font-size:21px;flex:none}.bubble{max-width:75%;padding:14px 17px;border-radius:20px;font-size:18px;line-height:1.4;box-shadow:0 3px 12px #0000000c}.bot .bubble{background:#fff;border-bottom-left-radius:6px}.user .bubble{background:#8ecae6;border-bottom-right-radius:6px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 10px 48px}.choice{border:0;border-radius:22px;padding:11px 16px;background:#fff;box-shadow:0 3px 10px #0001;font-size:16px;cursor:pointer}.choice:hover{transform:translateY(-1px);background:#fff8df}.composer{position:fixed;bottom:0;left:0;right:0;padding:15px;background:#ffffffef;border-top:1px solid #ddd}.composer-inner{max-width:860px;margin:auto;display:flex;gap:9px}input{flex:1;border:2px solid #d9e2ec;border-radius:25px;padding:13px 17px;font-size:16px;outline:none}button.send,button.mic{border:0;border-radius:50%;width:48px;height:48px;font-size:21px;cursor:pointer}.send{background:#ffb703}.mic{background:#caffbf}.note{text-align:center;font-size:11px;color:#7b8794;margin-top:7px}@media(max-width:600px){.bubble{max-width:82%}.choices{margin-left:0}h1{font-size:21px}}</style></head><body><div class="app"><header><div class="logo">🌈</div><div><h1>WonderBuddy</h1><div class="sub">A little chatbot for big imaginations ✨</div></div></header><main class="chat" id="chat"></main><div class="composer"><div class="composer-inner"><button class="mic" onclick="speakLast()">🔊</button><input id="input" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')sendText()"><button class="send" onclick="sendText()">➜</button></div><div class="note">No names, addresses, school details, photos, or other personal information are needed.</div></div></div><script>const questions=[{q:"If you could have ANY animal as your magical friend, which would you choose? 🦄",c:["🦄 Unicorn","🐼 Panda","🦖 Dinosaur","🐬 Dolphin"]},{q:"Your magic friend gives you one superpower. What do you pick? ✨",c:["🦸 Flying","🫥 Invisible","⚡ Super speed","🌱 Talk to plants"]},{q:"You find a treasure box. What is inside? 🎁",c:["🍭 Giant candy","💎 Sparkly gems","🗺️ Secret map","🧸 A teddy bear"]},{q:"Let's build a silly planet! What should fall from the sky? ☁️",c:["🍕 Pizza","🌈 Rainbows","🫧 Bubbles","⭐ Stars"]},{q:"A friendly dragon invites you for a ride. Where are you going? 🐉",c:["🏰 A castle","🌙 The moon","🌊 Under the sea","🌳 A giant forest"]},{q:"Quick one! Which sound makes you laugh the most? 😂",c:["🐸 Ribbit!","🐔 Cock-a-doodle-doo!","🐒 Ooo-oo-aa-aa!","🦆 Quack!"]},{q:"Story time! A tiny door appears under a tree. Do you open it? 🚪",c:["Yes! 🌟","Maybe… 👀","No, too spooky! 😄"]},{q:"Final challenge: invent a new ice-cream flavor! 🍦",c:["🌈 Rainbow","🍪 Cookie Rocket","🍉 Watermelon","🪐 Space Crunch"]}];let index=0,lastBot="";const chat=document.getElementById("chat");function addMessage(text,who="bot"){const row=document.createElement("div");row.className="msg "+who;if(who==="bot"){const a=document.createElement("div");a.className="avatar";a.textContent="🤖";row.appendChild(a)}const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;if(who==="bot")lastBot=text}function addChoices(items){const box=document.createElement("div");box.className="choices";items.forEach(x=>{const b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(x);box.appendChild(b)});chat.appendChild(box);chat.scrollTop=chat.scrollHeight}function ask(){if(index<questions.length){addMessage(questions[index].q);addChoices(questions[index].c)}else{addMessage("🎉 You did it! That was super fun! You have a BIG imagination. Want to play again?");addChoices(["🔄 Play again","🌟 Tell me a joke"])}}function answer(x){addMessage(x,"user");document.querySelectorAll(".choices").forEach(e=>e.remove());if(index>=questions.length){if(x.includes("Play")){index=0;setTimeout(ask,400)}else{setTimeout(()=>{addMessage("Why did the banana go to the doctor? 🍌 Because it wasn't peeling very well! 😂");addChoices(["🔄 Play again"])},350)}return}const praise=["Wow! 🌟","That is AMAZING!","Great choice! 🥳","Ooooh, I like that!","What a fun idea! ✨"];addMessage(praise[Math.floor(Math.random()*praise.length)]);index++;setTimeout(ask,550)}function sendText(){const input=document.getElementById("input"),v=input.value.trim();if(!v)return;input.value="";answer(v)}function speakLast(){if("speechSynthesis"in window&&lastBot){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastBot);u.rate=.9;u.pitch=1.2;speechSynthesis.speak(u)}}addMessage("Hi! 👋 I’m WonderBuddy! Let’s have a tiny adventure. There are no wrong answers—just silly, fun ones! Ready? 🌈");addChoices(["🚀 Let's go!","🎈 Yes!","🦄 Absolutely!"]);</script></body></html>
