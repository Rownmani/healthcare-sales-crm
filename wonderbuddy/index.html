<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WonderBuddy</title><style>body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#fff4d6,#e6f7ff);color:#263238}.app{max-width:760px;margin:auto;min-height:100vh}.head{padding:24px;text-align:center;background:#fff8}.card{margin:24px;background:#fff;padding:28px;border-radius:24px;box-shadow:0 8px 30px #0001}.q{font-size:25px;line-height:1.35}.choices{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.choice{border:0;border-radius:24px;padding:14px 18px;background:#ffe082;font-size:17px;cursor:pointer}.choice:hover{transform:translateY(-1px)}.small{font-size:12px;color:#718096;margin-top:20px;text-align:center}</style></head><body><div class="app"><div class="head"><h1>🌈 WonderBuddy</h1><p>A little chatbot for big imaginations ✨</p></div><div class="card"><div id="chat"></div><div id="choices" class="choices"></div><div class="small">A simple child-friendly demo. No personal information is requested.</div></div></div><script>const qs=[["If you could have any animal as a magical friend, who would it be? 🦄",["🦄 Unicorn","🐼 Panda","🦖 Dinosaur","🐬 Dolphin"]],["What superpower would you choose? ✨",["🦸 Flying","⚡ Super speed","🌱 Talk to plants","🫥 Invisible"]],["You found a treasure box! What is inside? 🎁",["🍭 Giant candy","💎 Sparkly gems","🗺️ Secret map","🧸 Teddy bear"]],["What should fall from the sky on your silly planet? ☁️",["🍕 Pizza","🌈 Rainbows","🫧 Bubbles","⭐ Stars"]],["Where would you ride with a friendly dragon? 🐉",["🏰 Castle","🌙 Moon","🌊 Under the sea","🌳 Giant forest"]]];let i=0;const chat=document.getElementById("chat"),choices=document.getElementById("choices");function show(){chat.innerHTML="<div class='q'>"+qs[i][0]+"</div>";choices.innerHTML="";qs[i][1].forEach(a=>{const b=document.createElement("button");b.className="choice";b.textContent=a;b.onclick=()=>{i++;if(i<qs.length){show()}else{chat.innerHTML="<div class='q'>🎉 Amazing! You have a super imagination!</div>";choices.innerHTML="<button class='choice' onclick='i=0;show()'>🔄 Play again</button>"}};choices.appendChild(b)})}show();</script></body></html>
